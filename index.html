<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brick Buddies</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
  .chip{background:rgba(20,30,60,.62);color:#fff;border-radius:999px;padding:4px 14px 4px 10px;display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .chip b{font-size:24px;min-width:1.5ch;text-align:left}
  .chip .slots{letter-spacing:2px;font-size:22px}
  .slots i{font-style:normal;filter:grayscale(1) brightness(.6);opacity:.6}
  .slots i.on{filter:none;opacity:1}
  #toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);font-size:120px;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
  #toast.show{animation:pop 1.3s ease-out}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.25) rotate(6deg)}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:16px;background:rgba(20,30,60,.6);color:#fff;padding:8px 18px;border-radius:999px;font-size:20px;font-weight:700;transition:opacity 1.5s;pointer-events:none;white-space:nowrap}
  #hint span{display:flex;align-items:center;gap:6px}
  kbd{background:#fff;color:#123;border-radius:6px;padding:1px 8px;font:800 16px "Segoe UI",sans-serif;box-shadow:0 2px 0 #9ab}
  #start{position:fixed;inset:0;background:linear-gradient(#57b8ff,#b6ecff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;z-index:10;transition:opacity .5s}
  #start h1{margin:0;font-size:clamp(44px,9vw,110px);color:#fff;letter-spacing:2px;text-shadow:0 6px 0 #e4002b,0 12px 0 rgba(0,0,0,.2);transform:rotate(-3deg)}
  #start .big{font-size:clamp(60px,12vw,150px);animation:bob 1s ease-in-out infinite}
  #start .row{font-size:clamp(28px,5vw,56px);display:flex;gap:26px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  @keyframes bob{50%{transform:translateY(-18px) scale(1.08)}}
</style>
</head>
<body>
<div id="hud">
  <div class="chip"><span>🪙</span><b id="cStuds">0</b></div>
  <div class="chip"><span class="slots" id="cGold"><i>⭐</i><i>⭐</i><i>⭐</i><i>⭐</i><i>⭐</i><i>⭐</i></span></div>
  <div class="chip"><span>🦆</span><b id="cDucks">0</b></div>
  <div class="chip"><span>🏗️</span><b id="cBuilds">0</b></div>
</div>
<div id="toast"></div>
<div id="hint">
  <span>🕹️ <kbd>WASD</kbd></span><span>⬆️ <kbd>Space</kbd></span><span>💥 <kbd>X</kbd></span><span>📣 <kbd>F</kbd></span><span>🎥 <kbd>Q</kbd><kbd>E</kbd></span><span>🎮 ✔</span>
</div>
<div id="start">
  <div class="big">🧱🦸🧱</div>
  <h1>BRICK BUDDIES</h1>
  <div class="row">▶ 🎮 ⌨️</div>
</div>
<script src="lib/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
